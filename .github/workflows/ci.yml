
# =============================================================================
# CI -- runs automatically on every save.
#
# PURPOSE: Check that the code compiles on multiple processor architectures,
# with compiler warnings treated as errors.
#
# EXPECTED EFFECT: A green check next to your commit if all builds pass.
# =============================================================================

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]

    # Run commands inside the actual project directory.
    defaults:
      run:
        working-directory: memprobe-template/memprobe-template

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile, warnings are errors
        run: make CFLAGS="-std=c11 -O2 -Wall -Wextra -Werror"

      - name: It runs
        run: |
          ./memprobe sizes
          ./memprobe verify

      # Check whether the timing loop has a compiler barrier.
      - name: Timing loop survived the optimiser
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! grep -q "asm" src/chase.c; then
            echo "::warning::No compiler barrier found in chase.c yet."
            echo "Without one, -O2 may delete your timing loop and you will"
            echo "measure an empty loop. See the TODO comments in that file."
          fi
